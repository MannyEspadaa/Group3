<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Universal Power Washing</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <h1>Universal Power Washing</h1>
    <p>Welcome back! Log in to manage your appointments and requests.</p>
    <p id="message" role="status" aria-live="polite"></p>
    <section id="login-section">
        <h2>Log In</h2>
        {% if error %}
            <p role="alert">{{ error }}</p>
        {% endif %}
        <form id="login-form" method="post" action="{{ url_for('login') }}">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" autocomplete="username" maxlength="254" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" minlength="12" maxlength="128" required>

            <button id="login-button" type="submit">Log In</button>
        </form>

        <p>Don't have an account?<a href="{{ url_for('register') }}">Create an account</a></p>
    </section>
</body>
</html>
